global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: node-bench
    static_configs:
      - targets: ["<BROKER_HOST>:9100"]
        labels: {hostname: jmqtt-broker}
      - targets: ["<DEVICE_HOST_1>:9100"]
        labels: {hostname: bench-device}
      - targets: ["<DEVICE_IP_2>:9100"]
        labels: {hostname: bench-device-2}
      - targets: ["<KAFKA_HOST>:9100"]
        labels: {hostname: bench-kafka}
      - targets: ["<MONITOR_HOST>:9100"]
        labels: {hostname: bench-monitor}
      - targets: ["<BACKEND_HOST>:9100"]
        labels: {hostname: bench-backend}
      - targets: ["<REDIS_HOST>:9100"]
        labels: {hostname: bench-redis}
      - targets: ["<BROKER_A_HOST>:9100"]
        labels: {hostname: jmqtt-broker-a}
      - targets: ["<BROKER_B_HOST>:9100"]
        labels: {hostname: jmqtt-broker-b}
      - targets: ["<PVE_HOST>:9100"]
        labels: {hostname: pve}
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance
  - job_name: jmqtt-broker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["<BROKER_HOST>:8922"]
        labels: {hostname: jmqtt-broker}
      - targets: ["<BROKER_A_HOST>:8922"]
        labels: {hostname: jmqtt-broker-a}
      - targets: ["<BROKER_B_HOST>:8922"]
        labels: {hostname: jmqtt-broker-b}
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
