run_id: "validate-steps"
broker: 10.0.0.1:1883
auth: {username: jmqtt, password: jmqtt}
kafka: {bootstrap: 10.0.0.2:9092, uplink: jmqtt-uplink, downlink: jmqtt-downlink, group: bench-backend}
topic_prefix: bench
payload_size: 256
qos: 1
keepalive: 120
baseline_period_s: 60
echo: true
devices: {total: 1000, instance_index: 0, instance_count: 1, connect_rate: 500}
source_ips: []
t0: 0
observe_broker: "http://10.0.0.1:8922/open/api/jmqtt/info"
observe_interval_s: 10
observe_nodes:
  - {name: jmqtt-broker, addr: 10.0.0.1}
  - {name: bench-device, addr: 10.0.1.1}
  - {name: bench-backend, addr: 10.0.0.3}
out_dir: /root/bench/validate-steps
steps:
  - {type: connect, target: 500}
  - {type: soak, duration: 60}
  - {type: connect, target: 1000}
  - {type: soak, duration: 60}
