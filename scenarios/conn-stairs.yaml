# 连接数阶梯: 加压维度 = 连接数。每设备每 60s 一条 PINGREQ + 一条指令,
# 指令 TPS = 连接数/60, backend 逐条回显(下行 TPS 同频)。
# 每级保温 5 分钟, 末级 10 分钟。预计全程 ≈40 分钟。
run_id: "conn-stairs"
broker: 10.0.0.1:1883
auth: {username: jmqtt, password: jmqtt}
kafka: {bootstrap: 10.0.0.2:9092, uplink: jmqtt-uplink, downlink: jmqtt-downlink, group: bench-backend}
topic_prefix: bench
payload_size: 256
qos: 1
keepalive: 120
baseline_period_s: 60
echo: true
clean_session: false
devices: {total: 300000, instance_index: 0, instance_count: 4, connect_rate: 2500}
source_ips: [10.0.1.1, 10.0.1.2, 10.0.1.3, 10.0.1.4, 10.0.1.5, 10.0.1.6, 10.0.1.7]
t0: 0
observe_broker: "http://10.0.0.1:8922/open/api/jmqtt/info"
observe_interval_s: 10
observe_nodes:
  - {name: jmqtt-broker, addr: 10.0.0.1}
  - {name: bench-device, addr: 10.0.1.1}
  - {name: bench-backend, addr: 10.0.0.3}
  - {name: bench-kafka, addr: 10.0.0.2}
  - {name: bench-redis, addr: 10.0.0.4}
  - {name: pve, addr: 10.0.0.6}
pub_ack_timeout_s: 10
abort_inflight_global: 300000
out_dir: /root/bench/conn-stairs
steps:
  - {type: connect, target: 10000}
  - {type: soak, duration: 300}
  - {type: connect, target: 30000}
  - {type: soak, duration: 300}
  - {type: connect, target: 60000}
  - {type: soak, duration: 300}
  - {type: connect, target: 120000}
  - {type: soak, duration: 300}
  - {type: connect, target: 200000}
  - {type: soak, duration: 300}
  - {type: connect, target: 300000}
  - {type: soak, duration: 600}
