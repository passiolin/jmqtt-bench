# 业务闭环阶梯 v2(干净日志版): 加压维度 = 连接数, 指令 TPS = 连接数/60。
# 每设备每 60s 一条 PINGREQ 心跳 + 一条 256B 指令(QoS1), backend 逐条回显。
# 持久会话(Redis 参与接入), broker INFO 日志(无 DEBUG 逐包开销)。
run_id: "conn-direct-300k"
broker: 10.0.0.1:1883
auth: {username: jmqtt, password: jmqtt}
kafka: {bootstrap: 10.0.0.2:9092, uplink: jmqtt-uplink, downlink: jmqtt-downlink, group: bench-backend}
topic_prefix: bench
payload_size: 256
qos: 1
keepalive: 120
baseline_period_s: 60
echo: true
clean_session: false
devices: {total: 300000, instance_index: 0, instance_count: 8, connect_rate: 600}
source_ips: [10.0.1.1, 10.0.1.2, 10.0.1.3, 10.0.1.4, 10.0.1.5, 10.0.1.6, 10.0.1.7, 10.0.2.1, 10.0.2.2, 10.0.2.3, 10.0.2.4, 10.0.2.5, 10.0.2.6, 10.0.2.7, 10.0.2.8]
t0: 0
observe_broker: "http://10.0.0.1:8922/open/api/jmqtt/info"
observe_interval_s: 10
observe_nodes:
  - {name: jmqtt-broker, addr: 10.0.0.1}
  - {name: bench-device, addr: 10.0.1.1}
  - {name: bench-device-2, addr: 10.0.2.1}
  - {name: bench-backend, addr: 10.0.0.3}
  - {name: bench-kafka, addr: 10.0.0.2}
  - {name: bench-redis, addr: 10.0.0.4}
  - {name: pve, addr: 10.0.0.6}
pub_ack_timeout_s: 10
abort_inflight_global: 300000
out_dir: /root/bench/conn-stairs-v2
steps:
  - {type: connect, target: 300000, duration: 600}
  - {type: soak, duration: 300}
